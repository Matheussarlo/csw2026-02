<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos e audios</title>
</head>
<body>
    <h1>Vídeos e Áudios</h1>
    <h2>Videos</h2>
    <p>
        ao clicar neste icone 
        <a href="./video.html"><img src="youtube.png "width="50px" alt="logo youtube"></a> 
        você será redirecionado para a página do vídeo do youtube
    </p>
    <p>
        ao clicar neste icone
        <a href="./vimeo.html"><img src="vimeo-logo.png" width="50px" alt="logo vimeo"></a> 
        você será redirecionado para a página do vídeo do vimeo
    </p>
    <br>
    <hr>
    <p><big>video local:</big>
        <video width="600" poster="vasco.webp" controls autoplay>
            <source src="vide_vasco.mp4" type="video/mp4" style="text-align: center;">
        </video>
    </p>
    <br>
    <hr>
    <h2>Audios</h2>
    <p><big>audio local:</big>
        <audio controls autoplay>
            <source src="hino_vasco.mp3" type="audio/mpeg">
        </audio>
</body>
</html>
