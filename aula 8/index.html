<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos e audios</title>
</head>
<body>
    <h1>Vídeos e Áudios</h1>
    <h2><big>Videos</big>/h2>
    <h3 style="color: red;" ><big>YouTube</big></h3>
    <p>
        ao clicar neste icone 
        <a href="./video.html"><img src="./imagens/youtube.png "width="50px" alt="logo youtube"></a> 
        você será redirecionado para a página do vídeo do youtube
    </p>
    <h3 style="color: blue;"><big>Vimeo</big></h3>
    <p>
        ao clicar neste icone
        <a href="./vimeo.html"><img src="./imagens/vimeo-logo.png" width="50px" alt="logo vimeo"></a> 
        você será redirecionado para a página do vídeo do vimeo
    </p>
    <br>
    <hr>
    <p><big>video local:</big>
        <video width="400px" poster="./imagens/vasco.webp"controls autoplay>
            <source src="./videos/vide_vasco.mp4" type="video/mp4" style="text-align: center;">
        </video>
    </p>
    <br>
    <hr>
    <h2>Audios</h2>
    <p><big>audio local:</big>
        <audio controls autoplay>
            <source src="./audios/hino_vasco.mp3" type="audio/mpeg">
        </audio>
</body>
</html>
