<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição para Vaga de Estágio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Inscrição para Vaga de Estágio</h1>
    <p>Campos marcados com * são obrigatórios.</p>
  </header>

  <main>
    <form action="/inscricao" method="post" enctype="multipart/form-data">

      <fieldset>
        <legend>Dados pessoais</legend>

        <p>
          <label for="nome">Nome completo *</label><br>
          <input type="text" id="nome" name="nome"
                 autocomplete="name" required
                 minlength="3" maxlength="100">
        </p>

        <p>
          <label for="email">E-mail (Gmail) *</label><br>
          <input type="email" id="email" name="email"
                 autocomplete="email" required
                 pattern="[A-Za-z0-9._%+\-]+@gmail\.com"
                 title="Informe um endereço Gmail, por exemplo: nome@gmail.com"
                 placeholder="nome@gmail.com">
        </p>

        <p>
          <label for="celular">Celular com DDD *</label><br>
          <input type="tel" id="celular" name="celular"
                 autocomplete="tel-national" inputmode="tel" required
                 pattern="\(?\d{2}\)?\s?9\d{4}-?\d{4}"
                 title="Use o formato (27) 99999-9999"
                 placeholder="(27) 99999-9999">
        </p>
      </fieldset>

      <fieldset>
        <legend>Sobre a vaga</legend>

        <p>
          <label for="area">Área de interesse *</label><br>
          <select id="area" name="area" autocomplete="off" required>
            <option value="" selected disabled>Selecione uma área</option>
            <option value="administrativo">Administrativo</option>
            <option value="tecnologia">Tecnologia da Informação</option>
            <option value="marketing">Marketing</option>
            <option value="financeiro">Financeiro</option>
            <option value="rh">Recursos Humanos</option>
          </select>
        </p>

        <p>
          <label for="curriculo">Currículo (PDF) *</label><br>
          <input type="file" id="curriculo" name="curriculo"
                 accept="application/pdf,.pdf" required>
        </p>
      </fieldset>

      <p>
        <input type="checkbox" id="lgpd" name="consentimento_lgpd"
               value="sim" required>
        <label for="lgpd">
          Autorizo o tratamento dos meus dados pessoais para fins de
          recrutamento e seleção, conforme a Lei Geral de Proteção de
          Dados (Lei nº 13.709/2018). *
        </label>
      </p>

      <button type="submit">Enviar inscrição</button>
    </form>
  </main>
</body>
</html>
