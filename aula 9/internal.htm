<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        body 
    {
        font-family: 'courier new', courier, monospace;
        font-size: 1em;
        color: blue;
        background-color: gray;
    }
    h1 {
        font-size: 2em;
        color: red;
    }
    h2 {
        color: brown;
    }
    p {
        color:green
    }
    </style>
<body>
    <h1>css interno</h1>
    <p>Este é um exemplo de css interno, ou seja, o css está dentro do arquivo html.</p>
    <h2>o css interno dita como sera o estilo da pagina</h2>
    <h3>o css interno é colocado dentro da tag style, que fica dentro da tag head</h3>

    
</body>
</html>
